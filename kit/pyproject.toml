[project]
name = "intuition-kit"
version = "0.1.0"
description = "Intuition: the executive-assistant evals workshop kit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "openai>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown>=3.6",
    "beautifulsoup4>=4.12",
    "tzdata>=2024.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# `ea-eval phoenix` (instructors): OpenTelemetry and OpenInference only; Phoenix itself runs separately
phoenix = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "openinference-semantic-conventions>=0.1.41",
]

[project.scripts]
ea-world = "ea_world.cli:main"
ea-eval = "ea_evals.cli:main"
ea-app = "ea_app.cli:main"
ea-start = "ea_app.cli:start"
ea-sites = "ea_sites.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ea_world", "ea_harness", "ea_evals", "ea_app", "ea_sites"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The Lesson 1 planted bug: find_free imports hours_problems but never calls it
"starter_overrides/**" = ["F401", "I001"]
