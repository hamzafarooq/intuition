title: Skills and skill evals
number: 2
duration: 35 min
goal: "House rules and definitions of done packaged as skills, with proof that each one loads when it should and changes behaviour when it does."
intro: |
  A **skill** is a folder with a `SKILL.md` file: a short description at the top, and instructions below.
  Claude Code shows the assistant only the descriptions at first. When a request matches one, it loads
  that skill's instructions. So a skill does two jobs: its description must trigger on the right requests
  (and not on others), and its instructions must make the work better. You'll test both.

  Each skill also carries a **definition of done**: the checks to run before saying a task is finished,
  the quality to aim for, and the signals that show afterwards whether it went well.
by_the_end:
  - "Four skills: scheduling, inbox-triage, meeting-brief and meeting-deck"
  - "Precision and recall for when a skill loads"
  - "A with-and-without comparison on scheduling and briefing cases"
  - "At least one description tightened because the numbers said so"

steps:
  - id: "2.1"
    title: Build the scheduling skill
    why: |
      Scheduling is where Maya's house rules matter most: nothing before 09:00 for anyone, 15-minute
      buffers, Tuesday to Thursday preferred, an agenda for external meetings, and never accepting on her
      behalf. In a skill, those rules load exactly when a scheduling request arrives, along with a checklist
      the assistant runs before it says done.
    prompt: |
      Create assistant/.claude/skills/scheduling/SKILL.md, following the "Writing assistant files" and "Markers" sections of CLAUDE.md.

      Frontmatter: name `scheduling`, and this description, word for word:
      "Use when Maya asks to find time, schedule, move or cancel a meeting, or block time. Not for reading or replying to email about meetings."

      Body sections: When to use; Steps; Rules that matter most; Definition of done.

      The steps must, in order: call clock_now; identify every attendee with contacts_lookup (if a name matches more than one person and context doesn't settle it, ask Maya and end with a waiting status); use calendar_find_free for internal attendees; pick the earliest slot that fits, preferring Tuesday to Thursday; for people outside Larkspur, draft an email proposing 2 to 3 slots in their own time zone instead of inviting them; create or move events only as house rule 7 allows; read the event back with calendar_get and look at the RSVPs.

      Rules to cite by number from assistant/CLAUDE.md: 1 (working hours in each person's zone, never before 09:00 or after 17:30), 2 (15-minute buffers), 3, 4 and 6 (external meetings), 5 (never accept or decline for Maya), 7 and 8 (approvals).

      Definition of done, as a checklist in three groups:
      - Hard checks: the event exists with exactly the intended people; inside every attendee's hours in their own zone; 15-minute buffers and no overlap; external meetings have an agenda; check_event returns ok; the read-back shows no declines.
      - Quality: the confirmation gives each attendee's local time; if nothing fits, it says so and why, and offers the nearest valid time.
      - Signals: all attendees accept and nobody proposes a new time. A decline means the time is wrong.
      End with the verifier to run: check_event after every create or update. Wrap the whole Definition of done, and the check_event step, in <!-- selfcheck:start --> and <!-- selfcheck:end --> markers.

      Don't mention specialist agents yet; they come in Lesson 3. When you're done, show me the frontmatter and the section headings.
    say: "Find 30 minutes with Dan and Lisa this week to review the Q4 forecast."
    run:
      - cd assistant && claude
    expect:
      - "The file starts with `---`, then the name and the description exactly as given."
      - "In the app, or in `cd assistant && claude`, the first thing behind the scenes is the scheduling skill loading."
      - "The event lands on Wed 28 Oct, 11:00 Denver / 13:00 New York / 17:00 London. Use \"Reset world\" in the app to try again."
    builds: ["assistant/.claude/skills/scheduling/SKILL.md"]

  - id: "2.2"
    title: Build inbox-triage and meeting-brief
    why: |
      Triage and briefs are reading jobs, but they still have a definition of done. Triage must catch the
      thread Maya dropped nine days ago and never act on a suspicious email. A brief must trace every
      number to a source. Writing these down is what lets the evals check them later.
    prompt: |
      Create two skills, following the "Writing assistant files" and "Markers" sections of CLAUDE.md. Use the scheduling skill you just wrote as the model for structure.

      1. assistant/.claude/skills/inbox-triage/SKILL.md
         Description, word for word: "Use when Maya asks what needs her attention, what she can ignore, what she's dropped, or for a summary of her inbox. Not for writing replies."
         Steps: email_search for recent and unread mail; email_read the candidates; classify each as needs Maya today, can wait, ignore, or suspicious; find threads where Maya hasn't replied in over a week.
         Definition of done: every needs-today email listed with the reason and the deadline; dropped threads called out; newsletters and notifications not listed as tasks; suspicious emails flagged and never acted on (house rule 10); no email text repeated beyond what's needed.

      2. assistant/.claude/skills/meeting-brief/SKILL.md
         Description, word for word: "Use when Maya asks to prepare for, or be briefed on, a meeting, customer or account. Not for making slides."
         Steps: calendar_get the meeting; read the related emails and the customer document (docs_search, docs_read); optionally web_search for recent news; write at most 250 words covering purpose, attendees, open issues, numbers, risks and suggested asks; brief_save with its sources.
         Definition of done: every number traced to a source (check_brief returns ok); open issues and any dropped thread included; when sources disagree, both values stated with the reason; fits on one screen. End with the verifier: check_brief after brief_save.

      Wrap each Definition of done, and each check_* step, in the selfcheck markers. Show me both descriptions when you're done.
    say:
      - "What needs me today?"
      - "Prep me for my 2pm with Ridgeway."
    run:
      - cd assistant && claude
    expect:
      - "\"What needs me today?\" loads inbox-triage and lists what needs Maya today, including Dan Reyes's unanswered pricing question from 17 October."
      - "The ops-sync email is flagged as suspicious, not acted on."
      - "\"Prep me for my 2pm\" loads meeting-brief, saves a brief, and runs `check_brief` on it."
    builds: ["assistant/.claude/skills/inbox-triage/SKILL.md", "assistant/.claude/skills/meeting-brief/SKILL.md"]

  - id: "2.3"
    title: Build meeting-deck
    why: |
      A deck is a brief in a stricter shape: a set number of slides, a claim in every headline, room for
      only so many words, and a last slide that asks for something. All of that can be checked, so
      `check_deck` catches overflowing text and numbers with no source before Maya sees them.
    prompt: |
      Create assistant/.claude/skills/meeting-deck/SKILL.md, following the "Writing assistant files" and "Markers" sections of CLAUDE.md. First read the deck_create and check_deck descriptions in ea_world/, so the steps use their real arguments.

      Description, word for word: "Use when Maya asks for slides or a deck. Not for a written brief."

      Steps: gather the facts as the meeting-brief skill does; plan the slides (5 unless Maya asks for another number); each slide gets a claim headline (a sentence that says something, not a topic label), at most 5 bullets, and its sources; the last slide is the ask or the decision; save with deck_create; run check_deck and fix what it reports.

      Definition of done: the slide count is what Maya asked for; check_deck returns ok (within the slide budgets, every number traced, sources on every slide); the deck ends with an ask. Wrap it, and the check_deck step, in the selfcheck markers.
    say: "Make me five slides for the Ridgeway meeting."
    run:
      - cd assistant && claude
    expect:
      - "The meeting-deck skill loads, not meeting-brief."
      - "`deck_create` saves five slides and `check_deck` returns ok, or the assistant fixes what it reports and checks again."
      - "The last slide asks for a decision, for example on the 2027 renewal or the pricing question."
    builds: ["assistant/.claude/skills/meeting-deck/SKILL.md"]

  - id: "2.4"
    title: Run the skill-trigger suite
    why: |
      A skill that never loads does nothing, and one that loads for everything gets in the way. The
      skill-trigger suite has 20 prompts that should load each skill and 20 near misses that shouldn't.
      From the traces it computes **precision** (when the skill loaded, was that right?) and **recall**
      (when it should have loaded, did it?).
    prompt: |
      I've run `uv run ea-eval component skill_triggers --skill scheduling --run-id triggers-scheduling`. Read evals/results/triggers-scheduling/component.json and the scheduling prompts in evals/components/skill_triggers.yaml. Don't change anything yet.

      Tell me:
      1. Precision and recall for the scheduling skill.
      2. Every "should" prompt where it didn't load, and every "should_not" prompt where it did.
      3. For each miss, which words in the skill's description probably caused it, and one change to the description that would fix it without breaking the prompts that already work.
    run:
      - uv run ea-eval component skill_triggers --skill scheduling --run-id triggers-scheduling
      - uv run ea-eval component skill_triggers --skill meeting-brief --run-id triggers-brief
    expect:
      - "40 short probes per skill, a few minutes each. It prints precision and recall."
      - "At least one skill misfires on near misses: an email about a meeting loads scheduling, or a deck request loads meeting-brief."
      - "Indirect requests (\"Dan and Lisa need to see the forecast before Friday\") are where recall drops."
    builds: ["evals/results/triggers-scheduling/component.json (trigger results)"]
    replay: replays/lesson2-skill-trigger.jsonl

  - id: "2.5"
    title: Skills off, then on
    why: |
      Loading isn't the goal; better work is. This run takes six golden cases and runs each twice: once with
      the skills folder removed, once with it in place. Nothing else changes, so the difference between the
      two spider charts is what your skills are worth.
    prompt: |
      I've run `uv run ea-eval run --slice lesson2-skills --run-id skills`. Read the grades in evals/results/skills/: there are two variants, skills=off and default. Don't change anything.

      For each case (S01, S02, S07, B01, D01, E01), tell me which criteria changed between skills=off and default, and in which direction. Then answer:
      1. Which spider-chart axes moved most?
      2. Without the skills, did any event land outside someone's working hours, or before 09:00 local time for anyone?
      3. Did anything get worse with the skills on?
    run:
      - uv run ea-eval run --slice lesson2-skills --run-id skills
    expect:
      - "12 trials (6 cases, two ways). The report overlays the two shapes: skills off and default."
      - "With the skills on, the Correct outcome and Good process axes grow."
      - "Without them, scheduling runs skip checks and read-backs more often, and some land outside a London attendee's working hours."
    builds: ["reports/skills.html (skills off vs on)"]

  - id: "2.6"
    title: Fix a description and rerun
    why: |
      Now act on the numbers. Tighten the description that misfired most, run the trigger suite again for
      that skill, and check the fix didn't break what already worked. This is the loop you'll repeat all
      day: measure, change one thing, measure again.
    prompt: |
      Using what you found in step 2.4 (evals/results/triggers-scheduling/component.json and triggers-brief if you ran it), tighten the description of the skill that misfired most. Change only its frontmatter description. Keep the "Use when …" and "Not for …" form, and keep it under 40 words.

      Show me the old and new descriptions side by side, and for each prompt that misfired, say why the new wording should handle it. I'll rerun the suite for that skill with a new run id.
    run:
      - uv run ea-eval component skill_triggers --skill scheduling --run-id triggers-scheduling-2
    expect:
      - "Precision or recall moves on the prompts you targeted."
      - "Watch the other side: a description tightened for precision can lose recall, and the other way round."
      - "If nothing moves, the description wasn't the cause. Read the probe's trace to see what the model reached for first."
    builds: ["assistant/.claude/skills/<skill>/SKILL.md (tighter description)"]

check:
  - q: "A skill that never loads scores 100% on \"no rule violations when the skill loaded\". Why is that misleading?"
    options:
      - "It isn't: 100% is 100%"
      - "The score only counts runs where the skill loaded, so a skill that never loads can't fail it. Recall shows the problem"
      - "Rule violations are graded by the judge, not by code"
    answer: 1
    why: "A score computed only over the times something happened says nothing when it never happens. Always read it beside recall."
  - q: "\"Reply to Raj that Thursday doesn't work\" loads the scheduling skill. Which number goes down?"
    options: ["Scheduling recall", "Scheduling precision", "Argument accuracy"]
    answer: 1
    why: "That prompt belongs to email-reply. Loading scheduling for it is a false positive, which lowers precision."
  - q: "Why run skills off and skills on with everything else unchanged?"
    options:
      - "To save plan usage"
      - "So any difference between the two runs can only come from the skills"
      - "Because the report needs two variants to draw a chart"
    answer: 1
    why: "Change one thing at a time. If two things change at once, you can't tell which one moved the shape."
