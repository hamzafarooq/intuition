<h1>Steel prices flat in October</h1>
<p class="byline">BuildCosts market brief, 22 October 2026</p>
<p>Structural steel prices were flat in October, unchanged from September, as demand from new commercial starts stayed soft.</p>
<p>Contractors told BuildCosts they see no pressure to lock in prices before the new year.</p>
