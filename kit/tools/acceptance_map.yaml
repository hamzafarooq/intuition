# Every PRD requirement and the evidence that proves it (spec/12-acceptance.md "Requirement traceability").
# tools/acceptance.py evaluates this and writes reports/acceptance.md.
#
# Evidence kinds:
#   tests:  pytest node prefixes ("tests/test_x.py" or "tests/test_x.py::test_name_prefix"); green when every matching test passed and at least one ran
#   files:  paths (relative to the kit) that must exist
#   check:  a named check in tools/acceptance.py
#   live:   {run, case, criteria?: [rubric/id, ...], passed?: bool} against evals/results/<run>; green when present and matching
#   pending: a live check that needs a larger run on the owner's Claude plan (named slice or the reference run)
#   manual: a check a person does (visual review, dry run)
#   exception: an accepted, written exception

