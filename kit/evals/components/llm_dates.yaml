# Component suite: date and time reasoning (Lesson 1.5). Spec: spec/10-component-suites.md.
#
# One `claude -p` call per trial with no tools and --append-system-prompt set to
# `system_prompt` below. Grader: exact match after normalization. Default 5 trials per item.
# Every answer was computed with Python zoneinfo (America/Denver, Europe/London,
# America/Chicago, America/New_York), not by hand.
#
# Clock-change facts the items lean on:
#   - London left summer time on Sunday 25 October 2026 (UTC+1 -> UTC+0).
#   - The US leaves daylight time on Sunday 1 November 2026 (Denver UTC-6 -> UTC-7).
#   - So for the week of 26 October London is 6 hours ahead of Denver, not the usual 7.
#
# Item fields: id, question (always ends with a format hint), answer (already normalized),
# kind (date | time | weekday | number), workshop (true for the 20 workshop items), tags.

system_prompt: "Today is Monday 26 October 2026, 08:30 in Denver (America/Denver). Answer with only the value requested, in the format requested."

normalize:
  all: "Trim whitespace, surrounding quotes or backticks, and a trailing period. If the reply has several lines, use the last non-empty line."
  date: "Compare as YYYY-MM-DD. Parse other spellings of a single calendar date (for example 'Tuesday, 3 November 2026' or '11/03/2026' read as month/day) and emit ISO."
  time: "Compare as HH:MM, 24-hour, zero-padded. '1pm', '1:00 PM' and '13:00:00' all become 13:00. Drop a trailing zone or city label ('17:00 GMT', '17:00 London')."
  weekday: "Compare as the full English weekday name with the first letter capitalized ('wednesday' and 'Wed' become Wednesday)."
  number: "Compare as an integer. Drop units and words ('6 hours' becomes 6) and a trailing '.0'."

