# Component suite: skill loading (Lesson 2.4). Spec: spec/10-component-suites.md.
#
# One `claude -p` call per prompt in the assistant folder, every ea-world tool recorded and
# denied (as in tool_use), --max-turns 2. Pass for a `should` prompt: a Skill tool use for this
# skill appears before any other tool use. Pass for a `should_not` prompt: this skill is not
# loaded. Precision and recall per skill.
#
# should:     {id, text, style}       style: plain | indirect | typo (typo = a plain request with typos)
#             per skill: 10 plain + 2 typo (60%), 8 indirect (40%)
# should_not: {id, text, belongs_to}  belongs_to: a neighbouring skill (near miss) or none
#             per skill: 10 near misses + 10 needing no skill
#
# Skill descriptions these are written against (spec/04-assistant.md):
#   scheduling    find time, schedule, move or cancel a meeting, or block time; not email about meetings
#   inbox-triage  what needs attention, what to ignore, what's dropped, inbox summary; not replies
#   meeting-brief prepare for / be briefed on a meeting, customer or account; not slides
#   meeting-deck  slides or a deck; not a written brief

skills:
  scheduling:
